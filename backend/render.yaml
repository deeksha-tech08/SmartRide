services:
  - type: web
    name: smartride-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:socket_app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGODB_URL
        sync: false
      - key: DATABASE_NAME
        value: smartride
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRY_HOURS
        value: "168"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: BASE_FARE
        value: "40"
      - key: PER_KM_RATE
        value: "10"
      - key: PER_MINUTE_RATE
        value: "1"
      - key: AVG_SPEED_KMPH
        value: "30"
      - key: FRONTEND_URL
        sync: false
      - key: ENVIRONMENT
        value: production
